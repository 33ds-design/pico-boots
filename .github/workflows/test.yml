name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup Lua 5.3
        uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.3"

      - name: Setup Luarocks
        uses: leafo/gh-actions-luarocks@v6

      - name: Install Lua test dependencies
        run: |
          luarocks install busted
          luarocks install luacov

      - name: Setup npm dependencies (luamin)
        run: ./setup.sh

      - name: Install picotool
        run: |
          wget -q https://github.com/dansanderson/picotool/archive/refs/heads/main.zip -O picotool.zip
          unzip -q picotool.zip -d tool
          chmod +x tool/picotool-main/p8tool
          echo "$PWD/tool/picotool-main" >> $GITHUB_PATH

      - name: Run Python toolchain tests
        run: |
          python3 -m scripts.test_add_metadata
          python3 -m scripts.test_add_require
          python3 -m scripts.test_minify

      - name: Run Lua tests
        run: ./test.sh -m all

      - name: Generate coverage report
        run: luacov -c config/.luacov_engine

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./luacov.report.out
          fail_ci_if_error: false
